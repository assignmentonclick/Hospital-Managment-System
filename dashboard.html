<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | HMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="dashboard-header">
        <h1>Hospital Management Dashboard</h1>
        <button id="logout" class="btn">Logout</button>
    </header>
    <main class="dashboard-main">
        <aside class="sidebar">
            <ul>
                <li><a href="#patients" class="active">Patients</a></li>
                <li><a href="#doctors">Doctors</a></li>
                <li><a href="#appointments">Appointments</a></li>
            </ul>
        </aside>
        <section class="content">
            <div id="patients" class="tab active">
                <h2>Patients</h2>
                <form id="patient-form" class="entity-form">
                    <input type="text" id="patient-name" placeholder="Name" required>
                    <input type="number" id="patient-age" placeholder="Age" required>
                    <input type="text" id="patient-gender" placeholder="Gender" required>
                    <button type="submit" class="btn btn-primary">Add Patient</button>
                </form>
                <table class="entity-table">
                    <thead>
                        <tr><th>Name</th><th>Age</th><th>Gender</th><th>Action</th></tr>
                    </thead>
                    <tbody id="patient-table"></tbody>
                </table>
            </div>
            <div id="doctors" class="tab">
                <h2>Doctors</h2>
                <form id="doctor-form" class="entity-form">
                    <input type="text" id="doctor-name" placeholder="Name" required>
                    <input type="text" id="doctor-speciality" placeholder="Speciality" required>
                    <button type="submit" class="btn btn-primary">Add Doctor</button>
                </form>
                <table class="entity-table">
                    <thead>
                        <tr><th>Name</th><th>Speciality</th><th>Action</th></tr>
                    </thead>
                    <tbody id="doctor-table"></tbody>
                </table>
            </div>
            <div id="appointments" class="tab">
                <h2>Appointments</h2>
                <form id="appointment-form" class="entity-form">
                    <input type="text" id="appointment-patient" placeholder="Patient" required>
                    <input type="text" id="appointment-doctor" placeholder="Doctor" required>
                    <input type="date" id="appointment-date" required>
                    <button type="submit" class="btn btn-primary">Add Appointment</button>
                </form>
                <table class="entity-table">
                    <thead>
                        <tr><th>Patient</th><th>Doctor</th><th>Date</th><th>Action</th></tr>
                    </thead>
                    <tbody id="appointment-table"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>
